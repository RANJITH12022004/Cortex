name: Keep Supabase alive

on:
  schedule:
    # Twice daily (UTC) — keeps the free-tier project from pausing after inactivity.
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi

          echo "Pinging ${SUPABASE_URL}"

          auth_status=$(curl -sS -o /tmp/auth-health.txt -w "%{http_code}" \
            "${SUPABASE_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "Auth health: HTTP ${auth_status}"

          rest_status=$(curl -sS -o /tmp/rest-root.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "REST API: HTTP ${rest_status}"

          if [ "${auth_status}" -ge 500 ] && [ "${rest_status}" -ge 500 ]; then
            echo "::error::Supabase did not respond successfully."
            exit 1
          fi

          echo "Supabase ping completed."
