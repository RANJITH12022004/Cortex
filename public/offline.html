<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cortex — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: linear-gradient(180deg, #f4f6f8 0%, #e9eef4 100%);
        color: #1a2a3a;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
        border: 1px solid #c9d4e2;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 50px rgba(25, 42, 58, 0.08);
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #4a5d73;
        line-height: 1.5;
      }
      .badge {
        display: inline-block;
        margin-bottom: 0.75rem;
        padding: 0.35rem 0.6rem;
        border-radius: 999px;
        background: #dbe7f3;
        color: #2c4a6e;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      a {
        color: #2c4a6e;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Cortex offline</div>
      <h1>You are offline</h1>
      <p>Cortex needs a network connection for live tasks, inventory updates, and push sync.</p>
      <p>Reconnect to continue, then refresh this page if the app does not resume automatically.</p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>
